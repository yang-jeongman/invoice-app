<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f4e79"><link rel="icon" href="icon-192.png">
<title>거래명세서</title>
<style>
:root{--pr:#1f4e79;--bg:#f2f4f7;--in:#fffbe6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.35 "Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:#222;padding-bottom:70px}
header{background:var(--pr);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0;flex:1}#st{font-size:12px;opacity:.9}
button,select,input,textarea{font:inherit}
button{padding:10px 14px;min-height:44px;border:1px solid #c5d0dc;border-radius:8px;background:#fff;color:var(--pr);font-weight:700}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{background:#fff;color:#c0392b;border-color:#e3b3ad}
button.ghost{border:0;background:none;padding:8px 4px}header button{min-height:36px;padding:6px 10px}
main{max-width:1000px;margin:0 auto;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccd;z-index:20}
nav button{flex:1;border:0;border-radius:0;background:none;color:#667;font-size:13px;min-height:58px;padding:4px}
nav button.on{color:var(--pr);border-top:3px solid var(--pr)}nav i{display:block;font-style:normal;font-size:20px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.sp{flex:1}
label{display:block;font-size:13px;color:#556}
input,select,textarea{width:100%;min-height:42px;border:1px solid #b9c2cc;border-radius:6px;padding:8px;background:var(--in)}
input[readonly]{background:#eee}input[type=checkbox]{width:auto;min-height:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.w2{grid-column:1/-1}
.tabs{display:flex;gap:6px;margin:6px 0}.tabs button{flex:1;background:#dde5ee;border:0}.tabs button.on{background:var(--pr);color:#fff}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:17px}
.dc{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px #0002;display:flex;gap:10px;align-items:center;cursor:pointer}
.dc .m{flex:1;min-width:0}.dc .t{font-weight:700}.dc .s{font-size:13px;color:#667}.dc .a{text-align:right;font-weight:700}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;font-weight:700}
.chip.u{background:#fde8e5;color:#b3261e}.chip.ok{background:#e1f3e4;color:#1b6e2e}.chip.w{background:#fff1cc;color:#8a5a00}.chip.b{background:#e3ecfa;color:#1f4e79}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid #aab}.thumbs button{position:absolute;top:2px;right:2px;min-height:30px;padding:0 8px}
.viewer{position:fixed;inset:0;background:#000d;z-index:60;overflow:auto;padding:10px}.viewer img{max-width:100%;display:block;margin:auto}
.fab{position:fixed;right:16px;bottom:76px;z-index:25;border-radius:28px;padding:0 20px;min-height:52px;box-shadow:0 3px 8px #0004}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:5px 6px;text-align:center}th{background:#e7eef7}td.r{text-align:right}
.pr input{text-align:right}
.gh,.gr{display:grid;grid-template-columns:34px minmax(100px,1.2fr) repeat(3,minmax(130px,1fr)) minmax(100px,1fr) 40px;gap:4px;align-items:center;margin-bottom:4px}
.gh{font-weight:700;text-align:center;font-size:13px;color:#445}
.gr .no{text-align:center;color:#889;font-size:13px}.it{display:flex;gap:3px}.it select{flex:1.2;min-width:0;padding:8px 2px}.it input{flex:1;min-width:0;padding:8px 4px;text-align:center}
.it .lb{display:none;font-size:12px;color:#667;align-self:center;white-space:nowrap}.gr .x{padding:0;min-height:42px;color:#b00}
@media(max-width:700px){
 .gh{display:none}
 .gr{grid-template-columns:26px 1fr 1fr 1fr;border-bottom:1px dashed #cbd;padding-bottom:6px;margin-bottom:6px}
 .gr .nm{grid-column:2/4;grid-row:1}.gr .x{grid-column:4;grid-row:1}.gr .no{grid-row:1}.gr .mm{grid-column:2/5;grid-row:3}.gr .it{grid-row:2}
 .gr .it:nth-of-type(1){grid-column:2}.gr .it:nth-of-type(2){grid-column:3}.gr .it:nth-of-type(3){grid-column:4}
 .it{flex-wrap:wrap}.it .lb{display:block;width:100%}.it select,.it input{flex:1 1 40%}
 .gr .it select{min-width:52px}
}
.sumt td,.sumt th{padding:4px}
.stm{background:#fff;padding:16px;max-width:760px;margin:auto}
.stm h2{text-align:center;letter-spacing:6px;margin:0 0 8px}
.stm .meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.stm .parties{display:flex;gap:8px;margin-bottom:8px}.stm .parties table{flex:1;font-size:12px}.stm .parties th{width:22%;white-space:nowrap}
.stm td,.stm th{padding:5px 6px}.stm .big{font-size:17px;font-weight:700}
.hide{display:none!important}
#print{display:none}
.modal{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:420px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;font-size:14px}
.muted{color:#667;font-size:13px}.warn{color:#b3261e}
@media print{body{padding:0;background:#fff}header,nav,main,.fab,.modal,.toast{display:none!important}#print{display:block}@page{size:A4;margin:12mm}.stm{padding:0;max-width:none}}
#print table{font-size:13px}
</style></head><body>
<header><h1>거래명세서 <small style="font-size:11px;font-weight:400">v2026.11.05-d</small></h1><span id="st"></span><button id="syncbtn" title="동기화">⟳ 동기화</button></header>
<main id="main"></main>
<nav id="nav">
<button data-nav="wo"><i>📝</i>작업지시</button><button data-nav="list"><i>📄</i>명세서</button><button data-nav="cust"><i>🏢</i>거래처</button>
<button data-nav="report"><i>📊</i>집계·미지급</button><button data-nav="settings"><i>⚙</i>설정</button></nav>
<div id="print"></div>
<script>
'use strict';
/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>(Math.round(+n||0)).toLocaleString('ko-KR');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const CODES=['가','직','가가'];
const PRESET={id:'c_bupyeong',type:'customer',kind:'labor',name:'부평',vat:'none',p:{top0:105000,top1:10000,vest0:50000,vest1:5000,bot0:50000,bot1:5000}};
const KL={labor:'인건비(임가공)',material:'자재'};
const kind=o=>(o&&o.kind)||'labor';
const emptyRow=()=>({n:'',a:'',aq:'',b:'',bq:'',c:'',cq:'',m:''});
const rowHas=r=>r.n||r.aq||r.bq||r.cq||r.a||r.b||r.c||r.m;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(title,body,ok,okText='확인'){const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="box"><b>${esc(title)}</b>${body}<div class="row"><button class="p sp" data-ok>${okText}</button><button class="sp" data-no>취소</button></div></div>`;
 document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.dataset.no!==undefined)m.remove();else if(e.target.dataset.ok!==undefined){if(ok(m)!==false)m.remove()}};return m}
function download(name,text,type='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');

/* ================= 저장소 (IndexedDB) ================= */
let idb;const E=new Map();let dirty=new Set(),shas={};
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('invoice_v2',1);r.onupgradeneeded=()=>{r.result.createObjectStore('ent',{keyPath:'id'});r.result.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store=(s,m='readonly')=>idb.transaction(s,m).objectStore(s);
const dbPut=(s,v)=>req(store(s,'readwrite').put(v));
const saveMeta=async()=>{await dbPut('meta',{k:'dirty',v:[...dirty]});await dbPut('meta',{k:'shas',v:shas})};
async function put(e){e.updatedAt=Date.now();E.set(e.id,e);await dbPut('ent',e);dirty.add(e.id);await saveMeta();setSt();scheduleSync()}
const timers={};
function touch(e){setSt('저장 중…');clearTimeout(timers[e.id]);timers[e.id]=setTimeout(()=>{delete timers[e.id];put(e)},400)}
async function flush(){for(const id of Object.keys(timers)){clearTimeout(timers[id]);delete timers[id];await put(E.get(id))}}
const ents=t=>[...E.values()].filter(e=>e.type===t);
const customers=()=>ents('customer').filter(e=>!e.deleted).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
const allDocs=()=>ents('doc').filter(e=>!e.deleted);
const getBiz=()=>(E.get('settings')||{}).biz||{};

/* ================= 계산 ================= */
function sums(d){const r={};for(const k of['a','b','c']){r[k]={tot:0,g:0,j:0,gg:0,blank:0};for(const x of d.rows){r[k].tot+=+x[k+'q']||0;const v=x[k];if(v==='가')r[k].g++;else if(v==='직')r[k].j++;else if(v==='가가')r[k].gg++;else r[k].blank++}}return r}
function calc(d){const s=sums(d),p=d.p||{},M=kind(d)==='material';
 const L=M?[]:[['상의',s.a.tot,p.top0],['바지',s.c.tot,p.bot0],['조끼',s.b.tot,p.vest0],['상의가봉',s.a.g,p.top1],['바지가봉',s.c.g,p.bot1],['조끼가봉',s.b.g,p.vest1]];
 if(M)(d.items||[]).forEach(x=>L.push([(x.n||'품목')+(x.spec?' ('+x.spec+')':''),+x.q||0,+x.u||0]));
 (d.extra||[]).forEach(x=>L.push([x.n||'기타',+x.q||0,+x.u||0]));
 const lines=L.filter(l=>l[1]!==0).map(([n,q,u])=>({n,q,u,a:q*u}));
 const supply=lines.reduce((a,l)=>a+l.a,0),vat=d.vat==='excl'?Math.round(supply/10):0,total=supply+vat;
 const paid=(d.pay||[]).reduce((a,x)=>a+(+x.amt||0),0);return{s,lines,supply,vat,total,paid,due:total-paid}}
const cname=d=>(E.get(d.cid)||{}).name||'(삭제된 거래처)';
const mkNo=d=>d.date.replace(/-/g,'')+'-'+d.id.slice(-3).toUpperCase();
const custDue=cid=>allDocs().filter(d=>d.cid===cid).reduce((a,d)=>a+calc(d).due,0);
function prevBal(d){return allDocs().filter(x=>x.cid===d.cid&&x.id!==d.id&&(x.date<d.date||(x.date===d.date&&x.id<d.id))).reduce((a,x)=>a+calc(x).due,0)}

/* ================= 상태 / 라우팅 ================= */
const S={view:'list',docId:null,cid:null,wid:null,wf:{cid:'',st:'',q:''},tab:'input',f:{cid:'',month:'',st:'',q:'',kind:''},month:today().slice(0,7)};
const D=()=>S.docId&&E.get(S.docId);
function go(v,o={},replace){Object.assign(S,{view:v},o);history[replace?'replaceState':'pushState']({view:S.view,docId:S.docId,cid:S.cid,wid:S.wid,tab:S.tab},'');render();window.scrollTo(0,0)}
window.onpopstate=e=>{flush();const s=e.state;if(s)Object.assign(S,{view:s.view,docId:s.docId,cid:s.cid,wid:s.wid,tab:s.tab});else S.view='list';render()};
function render(){const v={list:vList,editor:vEditor,cust:vCust,custEdit:vCustEdit,report:vReport,settings:vSettings,wo:vWoList,woEdit:vWoEdit}[S.view]||vList;
 $('#main').innerHTML=v();const nv=S.view==='editor'?'list':S.view==='custEdit'?'cust':S.view==='woEdit'?'wo':S.view;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===nv))}

/* ================= 화면: 명세서 목록 ================= */
function filteredDocs(){const f=S.f,q=f.q.trim();
 return allDocs().filter(d=>(!f.cid||d.cid===f.cid)&&(!f.kind||kind(d)===f.kind)&&(!f.month||d.date.startsWith(f.month))&&
  (!f.st||(f.st==='u'?calc(d).due>0:calc(d).due<=0))&&(!q||cname(d).includes(q)||d.rows.some(r=>(r.n||'').includes(q)))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}
function vList(){const cs=customers(),ds=filteredDocs();let tot=0,due=0;ds.forEach(d=>{const k=calc(d);tot+=k.total;due+=k.due});
 return `<div class="card grid2">
 <label>거래처<select data-flt="cid"><option value="">전체</option>${cs.map(c=>`<option value="${c.id}"${S.f.cid===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <label>월<input type="month" data-flt="month" value="${S.f.month}"></label>
 <label>구분<select data-flt="kind"><option value="">전체</option><option value="labor"${S.f.kind==='labor'?' selected':''}>인건비(임가공)</option><option value="material"${S.f.kind==='material'?' selected':''}>자재</option></select></label>
 <label>상태<select data-flt="st"><option value="">전체</option><option value="u"${S.f.st==='u'?' selected':''}>미지급</option><option value="p"${S.f.st==='p'?' selected':''}>완납</option></select></label>
 <label>검색(거래처/이름)<input data-flt="q" value="${esc(S.f.q)}" placeholder="이름 검색"></label></div>
 <div class="muted" style="margin:0 4px 8px">${ds.length}건 · 합계 ${fmt(tot)}원 · 미지급 ${fmt(due)}원</div>
 ${ds.map(d=>{const k=calc(d);return `<div class="dc" data-act="open" data-id="${d.id}"><div class="m"><div class="t">${esc(cname(d))}</div><div class="s">${d.date} · ${kind(d)==='material'?'자재 '+(d.items||[]).filter(x=>x.n).length+'품목':'인건비 '+d.rows.filter(r=>r.n).length+'명'}${d.memo?' · '+esc(d.memo):''}</div></div>
 <div class="a">${fmt(k.total)}원<br>${k.total===0?'':k.due<=0?'<span class="chip ok">완납</span>':`<span class="chip u">미지급 ${fmt(k.due)}</span>`}</div></div>`}).join('')||'<div class="card muted">저장된 명세서가 없습니다. 아래 “+ 새 명세서”를 누르세요.</div>'}
 <button class="p fab" data-act="newdoc">+ 새 명세서</button>`}

/* ================= 화면: 명세서 편집 ================= */
function rowHTML(r,i){const it=(k,l)=>`<div class="it"><span class="lb">${l}</span><select data-k="${k}"><option value="">${l}</option>${CODES.map(c=>`<option${r[k]===c?' selected':''}>${c}</option>`).join('')}</select><input type="number" min="0" inputmode="numeric" data-k="${k}q" value="${r[k+'q']}" placeholder="수량"></div>`;
 return `<div class="gr" data-i="${i}"><span class="no">${i+1}</span><input class="nm" data-k="n" value="${esc(r.n)}" placeholder="고객명">${it('a','상의')}${it('b','조끼')}${it('c','하의')}<input class="mm" data-k="m" value="${esc(r.m)}" placeholder="추가사항"><button class="x" data-act="delrow" data-i="${i}">✕</button></div>`}
function calcBox(d){const k=calc(d),s=k.s,M=kind(d)==='material';
 const tbl=M?'':`<table class="sumt"><tr><th></th><th>상의</th><th>조끼</th><th>하의</th></tr>${[['전체 개수','tot'],['가봉(가)','g'],['직','j'],['가가','gg'],['공란','blank']].map(([n,x])=>`<tr><th>${n}</th><td>${s.a[x]}</td><td>${s.b[x]}</td><td>${s.c[x]}</td></tr>`).join('')}</table>`;
 return `${tbl}
 <div style="margin-top:8px;text-align:right">공급가액 <b>${fmt(k.supply)}</b>${k.vat?` + 부가세 <b>${fmt(k.vat)}</b>`:''} = 합계 <b style="font-size:18px">${fmt(k.total)}원</b></div>
 ${!M&&d.rows.some(r=>!r.n&&(r.aq||r.bq||r.cq))?'<div class="warn">⚠ 이름 없이 수량만 입력된 행이 있습니다</div>':''}`}
function itemRow(x,i){return `<div class="row" style="margin-top:6px"><input style="flex:2;min-width:100px" data-it="${i}:n" value="${esc(x.n)}" placeholder="품목(자재명)"><input style="flex:1.2;min-width:70px" data-it="${i}:spec" value="${esc(x.spec)}" placeholder="규격"><input style="flex:.8;min-width:60px" type="number" inputmode="decimal" data-it="${i}:q" value="${x.q}" placeholder="수량"><input style="flex:1.2;min-width:80px" type="number" inputmode="numeric" data-it="${i}:u" value="${x.u}" placeholder="단가"><button class="d" data-act="delitem" data-i="${i}">✕</button></div>`}
function tItems(d){return `<div class="card"><b>자재 내역</b> <span class="muted">(단가는 할인·반품은 -로)</span>${(d.items||[]).map(itemRow).join('')}<div class="row" style="margin-top:8px"><button data-act="additem">+ 품목 추가</button><button data-act="additems">+ 5행</button></div></div><div class="card" id="calcbox">${calcBox(d)}</div>`}
function tInput(d){const pr=(k,l)=>`<td><input data-p="${k}" type="number" inputmode="numeric" value="${d.p[k]}"></td>`;
 return `<div class="card"><table class="pr"><tr><th></th><th>상의</th><th>조끼</th><th>하의</th></tr>
 <tr><th>단가</th>${pr('top0')}${pr('vest0')}${pr('bot0')}</tr><tr><th>가봉 단가</th>${pr('top1')}${pr('vest1')}${pr('bot1')}</tr></table>
 <div class="muted">이 명세서에만 적용됩니다. 거래처 기본 단가는 거래처 메뉴에서 바꿉니다.</div></div>
 <div class="card"><div class="gh"><span>#</span><span>고객명</span><span>상의</span><span>조끼</span><span>하의</span><span>추가사항</span><span></span></div><div id="grid">${d.rows.map(rowHTML).join('')}</div>
 <div class="row"><button data-act="addrow">+ 행 추가</button><button data-act="addrows">+ 10행</button><button class="p" data-act="fromwo">작업지시서에서 가져오기</button><button data-act="loadnames">지난 명세서 이름 가져오기</button></div></div>
 <div class="card"><b>기타 항목</b> <span class="muted">(수선비·배송비·할인 등, 할인은 단가를 -로)</span>
 ${(d.extra||[]).map((x,i)=>`<div class="row" style="margin-top:6px"><input style="flex:2;min-width:90px" data-x="${i}:n" value="${esc(x.n)}" placeholder="항목명"><input style="flex:1;min-width:60px" type="number" inputmode="numeric" data-x="${i}:q" value="${x.q}" placeholder="수량"><input style="flex:1.3;min-width:80px" type="number" inputmode="numeric" data-x="${i}:u" value="${x.u}" placeholder="단가"><button class="d" data-act="delextra" data-i="${i}">✕</button></div>`).join('')}
 <div style="margin-top:8px"><button data-act="addextra">+ 기타 항목 추가</button></div></div>
 <div class="card" id="calcbox">${calcBox(d)}</div>`}
function stmtHTML(d){const c=E.get(d.cid)||{name:'(삭제된 거래처)'},b=getBiz(),k=calc(d),pb=prevBal(d);

function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.6))};img.onerror=rej;img.src=u})}

async function applyPreset(force){const c=E.get(PRESET.id);if(c&&!force)return;const n=JSON.parse(JSON.stringify(PRESET));if(c){n.deleted=false;n.bank=c.bank;n.rep=c.rep;n.phone=c.phone;n.bizno=c.bizno;n.addr=c.addr;n.memo=c.memo}
 if(force)await put(n);else{n.updatedAt=1;E.set(n.id,n);await dbPut('ent',n);dirty.add(n.id);await saveMeta()}}

function refreshCalc(){const d=D(),b=$('#calcbox');if(b&&d)b.innerHTML=calcBox(d)}
$('#main').addEventListener('input',e=>{const t=e.target,ds=t.dataset;
 if(ds.wflt){S.wf[ds.wflt]=t.value;const pos=t.selectionStart;render();if(ds.wflt==='q'){const i=document.querySelector('[data-wflt=q]');i.focus();i.setSelectionRange(pos,pos)}return}
 if(ds.flt){S.f[ds.flt]=t.value;const pos=t.selectionStart;render();if(ds.flt==='q'){const i=document.querySelector('[data-flt=q]');i.focus();i.setSelectionRange(pos,pos)}return}
 if(t.id==='rmonth'){S.month=t.value||S.month;render();return}
 if(ds.bz){const s=E.get('settings')||{id:'settings',type:'settings',biz:{}};E.set('settings',s);s.biz[ds.bz]=t.value;touch(s);return}
 if(ds.cf||ds.cp){const c=E.get(S.cid);if(ds.cf)c[ds.cf]=t.value;else c.p[ds.cp]=+t.value||0;touch(c);if(ds.cf==='kind')render();return}
 if(S.view==='woEdit'){const w=E.get(S.wid);if(w){let ok=true;
  if(ds.wf)w[ds.wf]=t.value;else if(ds.wd)w.d[ds.wd]=t.value;else if(ds.wq)w.qty[ds.wq]=t.value;
  else if(ds.wsz){const[g,n,k]=ds.wsz.split(':'),key=g+':'+n;(w.sz[key]=w.sz[key]||{})[k]=t.value}else ok=false;
  if(ok){touch(w);return}}}
 const d=D();if(!d||S.view!=='editor')return;
 const row=t.closest('[data-i]');
 if(row&&ds.k){const r=d.rows[row.dataset.i],k=ds.k;r[k]=t.value;
  if(t.tagName==='SELECT'&&t.value&&!r[k+'q']){r[k+'q']=1;row.querySelector(`[data-k=${k}q]`).value=1}}
 else if(ds.p)d.p[ds.p]=+t.value||0;
 else if(ds.f){d[ds.f]=t.value;if(ds.f==='date'){d.no=mkNo(d);$('#docno').value=d.no}}
 else if(ds.x){const[i,k]=ds.x.split(':');d.extra[i][k]=t.value}
 else if(ds.it){const[i,k]=ds.it.split(':');d.items[i][k]=t.value}
 else return;
 touch(d);refreshCalc()});

  share(){const k=calc(d),txt=`[${cname(d)}] ${d.date} 거래명세\n`+k.lines.map(l=>`${l.n} ${fmt(l.q)} × ${fmt(l.u)} = ${fmt(l.a)}`).join('\n')+`\n합계 ${fmt(k.total)}원${k.vat?` (부가세 ${fmt(k.vat)} 포함)`:''}${getBiz().bank?'\n입금계좌 '+getBiz().bank:''}`;
   if(navigator.share)navigator.share({title:'거래명세서',text:txt}).catch(()=>{});else navigator.clipboard.writeText(txt).then(()=>toast('내용을 복사했습니다'))},
  csvdoc(){const k=calc(d),r=[['거래처',cname(d)],['거래일자',d.date],['문서번호',d.no],[],['품목','수량','단가','공급가액'],...k.lines.map(l=>[l.n,l.q,l.u,l.a]),['공급가액','','',k.supply],['부가세','','',k.vat],['합계','','',k.total],[],['번호','고객명','상의','수량','조끼','수량','하의','수량','추가사항'],...(kind(d)==='labor'?d.rows.filter(rowHas).map((x,i)=>[i+1,x.n,x.a,x.aq,x.b,x.bq,x.c,x.cq,x.m]):[])];
   download(`거래명세서_${cname(d)}_${d.date}.csv`,csv(r))},
  async clone(){await flush();const n={...JSON.parse(JSON.stringify(d)),id:'d_'+uid(),date:today(),pay:[],deleted:false};n.no=mkNo(n);await put(n);go('editor',{docId:n.id,tab:'input'});toast('복제했습니다 (거래일자 확인)')},
  async deldoc(){if(!confirm('이 명세서를 삭제할까요? (설정 > 휴지통에서 복원 가능)'))return;await flush();d.deleted=true;await put(d);for(const w of allWO().filter(x=>x.billed===d.id)){w.billed='';w.status='done';await put(w)}go('list',{})},
  async addpay(){const amt=+$('#pay_a').value;if(!amt)return toast('금액을 입력하세요');(d.pay=d.pay||[]).push({d:$('#pay_d').value||today(),amt,note:$('#pay_n').value});touch(d);render()},

   modal('새 작업지시서',`<label>의뢰업체<select id="nw_c">${cs.map(c=>`<option value="${c.id}"${c.id===S.wf.cid?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>고객명<input id="nw_n"></label>`,m=>{

   if(w.status==='open'){w.status='done';if(!w.d.done)w.d.done=today()}else w.status='open';touch(w);render()},

  addphoto(){const w=E.get(S.wid);if(w.photos.length>=4)return toast('사진은 최대 4장입니다');$('#wphoto').click()},

     d.rows=rows;while(d.rows.length<10)d.rows.push(emptyRow());await put(d);render();toast(ids.length+'건 가져왔습니다')})()},'가져오기')},

$('#main').addEventListener('change',async e=>{const t=e.target;
 if(t.id==='wphoto'){const w=E.get(S.wid);if(!w)return;try{for(const f of [...t.files]){if(w.photos.length>=4)break;w.photos.push(await shrink(f))}touch(w);render()}catch{toast('사진을 불러오지 못했습니다')}t.value='';return}

  else if(j.cust){n=await migrateV1(j)}else throw 0;await saveMeta();toast(n+'건 반영했습니다');scheduleSync();render()}catch{alert('올바른 백업 파일이 아닙니다')}t.value=''}});

 modal('새 명세서',`<label>거래처<select id="nd_c">${cs.map(c=>`<option value="${c.id}"${c.id===(preCid||S.f.cid)?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>거래일자<input type="date" id="nd_d" value="${today()}"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="nd_n"> 지난 명세서의 이름 목록 가져오기(인건비)</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="nd_w" checked> 완료된 작업지시서 자동 포함(인건비)</label>`,async m=>{
  const c=E.get(m.querySelector('#nd_c').value),date=m.querySelector('#nd_d').value||today();
  const M=kind(c)==='material';
  let rows=[];if(!M&&m.querySelector('#nd_n').checked){const prev=allDocs().filter(x=>x.cid===c.id).sort((x,y)=>y.date.localeCompare(x.date))[0];if(prev)rows=prev.rows.filter(r=>r.n).map(r=>({...emptyRow(),n:r.n}))}
  const wl=(!M&&m.querySelector('#nd_w').checked)?allWO().filter(w=>w.cid===c.id&&w.status==='done'):[];wl.forEach(w=>rows.push(woToRow(w)));
  if(!M)while(rows.length<(wl.length?wl.length+10:30))rows.push(emptyRow());
  const d={id:'d_'+uid(),type:'doc',kind:kind(c),cid:c.id,date,rows,p:{...(c.p||{})},extra:[],items:M?Array.from({length:5},()=>({n:'',spec:'',q:'',u:''})):[],vat:c.vat||'none',pay:[],memo:''};d.no=mkNo(d);await put(d);for(const w of wl){w.billed=d.id;w.status='billed';await put(w)}go('editor',{docId:d.id,tab:'input'})},'작성 시작')}
function rosterHTML(d){const k=calc(d),s=k.s,fm=v=>v||'';
 return `<h2 style="text-align:center">작업내역서</h2><p>의뢰업체: <b>${esc(cname(d))}</b> &nbsp; 거래일자: ${esc(d.date)}</p><table><tr><th>No</th><th>고객명</th><th>상의</th><th>수량</th><th>조끼</th><th>수량</th><th>하의</th><th>수량</th><th>추가사항</th></tr>${d.rows.filter(rowHas).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${fm(r.a)}</td><td>${fm(r.aq)}</td><td>${fm(r.b)}</td><td>${fm(r.bq)}</td><td>${fm(r.c)}</td><td>${fm(r.cq)}</td><td style="text-align:left">${esc(r.m)}</td></tr>`).join('')}</table><p>합계: 상의 ${s.a.tot} / 조끼 ${s.b.tot} / 하의 ${s.c.tot} (가봉 ${s.a.g}건 · 직봉 ${s.a.j}건)</p>`}

/* ================= 동기화 (GitHub 비공개 저장소) ================= */
let syncing=false,syncTimer=null;
const lastSync=()=>+localStorage.getItem('last_sync')||0;
function setSt(msg){const c=cfg();const m=msg||(Object.keys(timers).length?'저장 중…':!c?'이 기기에만 저장됨':!navigator.onLine?`오프라인 · 대기 ${dirty.size}건`:dirty.size?`동기화 대기 ${dirty.size}건`:'✓ 동기화됨 '+new Date(lastSync()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
 $('#st').textContent=m;const s=$('#synstat');if(s)s.textContent=' · '+m}
function scheduleSync(){if(!cfg())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),3000)}
async function gh(path,raw){const c=cfg();const r=await fetch(`https://api.github.com/repos/${c.repo}${path}`,{cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
 if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}return raw?r.text():r.json()}
const b64=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(o)};
async function ghPut(id,e){const c=cfg();const body={message:'update '+id,content:b64(JSON.stringify(e)),branch:'main'};if(shas[id])body.sha=shas[id];
 const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/data/${id}.json`,{method:'PUT',cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){const er=new Error('GitHub '+r.status);er.status=r.status;throw er}return (await r.json()).content.sha}
async function sync(manual){const c=cfg();if(!c||syncing)return;if(!navigator.onLine){setSt();if(manual)toast('오프라인입니다');return}
 syncing=true;setSt('동기화 중…');let changed=false;
 try{await flush();
  for(let attempt=0;attempt<3;attempt++){
   const tree=await gh('/git/trees/main?recursive=1'),remote={};
   for(const t of tree.tree){const m=/^data\/(.+)\.json$/.exec(t.path);if(m&&t.type==='blob')remote[m[1]]=t.sha}
   for(const id of Object.keys(remote)){if(shas[id]===remote[id])continue;
    const e=JSON.parse(await gh('/git/blobs/'+remote[id],true)),l=E.get(id);
    if(!l||e.updatedAt>l.updatedAt){E.set(id,e);await dbPut('ent',e);dirty.delete(id);changed=true}else if(e.updatedAt<l.updatedAt)dirty.add(id);
    shas[id]=remote[id]}
   for(const id of Object.keys(remote))if(!shas[id])shas[id]=remote[id];
   let conflict=false;
   for(const id of [...dirty]){const e=E.get(id);if(!e){dirty.delete(id);continue}
    try{shas[id]=await ghPut(id,e);dirty.delete(id)}catch(er){if(er.status===409||er.status===422){conflict=true;delete shas[id];break}throw er}}
   await saveMeta();if(!conflict)break}
  localStorage.setItem('last_sync',Date.now());setSt();if(manual)toast('동기화 완료');
  if(changed){if(S.view==='editor'&&!E.get(S.docId))S.view='list';if(!document.activeElement||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()}
 }catch(er){const m=er.status===401||er.status===403?'토큰 오류 — 설정에서 확인':er.status===404?'저장소를 찾을 수 없음 — 설정 확인':'동기화 실패(나중에 다시 시도)';setSt(m);if(manual)toast(m)}
 finally{syncing=false}}
addEventListener('online',()=>sync(false));addEventListener('offline',()=>setSt());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();else sync(false)});
addEventListener('pagehide',()=>flush());
$('#syncbtn').onclick=()=>cfg()?sync(true):(go('settings',{}),toast('설정에서 동기화를 연결하세요'));
setInterval(()=>sync(false),120000);

/* ================= 이전 버전(v1) 데이터 이전 ================= */
async function migrateV1(j){let n=0;for(const[name,s]of Object.entries(j.cust)){
 const p=s.p||{};const c={id:'c_'+uid(),type:'customer',name,p:{top0:p.top0??105000,top1:p.top1??10000,vest0:p.vest0??50000,vest1:p.vest1??5000,bot0:p.bot0??50000,bot1:p.bot1??5000},vat:'none',updatedAt:Date.now()};
 E.set(c.id,c);await dbPut('ent',c);dirty.add(c.id);n++;
 if(s.rows&&s.rows.some(rowHas)){const d={id:'d_'+uid(),type:'doc',cid:c.id,date:s.date||today(),rows:s.rows.map(r=>({...emptyRow(),...r})),p:c.p,extra:[],vat:'none',pay:[],memo:'',updatedAt:Date.now()};d.no=mkNo(d);E.set(d.id,d);await dbPut('ent',d);dirty.add(d.id);n++}}return n}

(async()=>{idb=await openDB();
 for(const e of await req(store('ent').getAll()))E.set(e.id,e);
 const dm=await req(store('meta').get('dirty')),sm=await req(store('meta').get('shas'));dirty=new Set(dm?dm.v:[]);shas=sm?sm.v:{};

 if(old&&!E.size){try{await migrateV1(JSON.parse(old));await saveMeta()}catch{}}
 if(!ents('customer').length)await applyPreset(false);
 history.replaceState({view:'list'},'');render();setSt();

 if(cfg())sync(false);
})();
