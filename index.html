<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f4e79"><link rel="icon" href="icon-192.png">
<title>거래명세서</title>
<style>
:root{--pr:#1f4e79;--bg:#f2f4f7;--in:#fffbe6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.35 "Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:#222;padding-bottom:70px}
header{background:var(--pr);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0;flex:1}#st{font-size:12px;opacity:.9}
button,select,input,textarea{font:inherit}
button{padding:10px 14px;min-height:44px;border:1px solid #c5d0dc;border-radius:8px;background:#fff;color:var(--pr);font-weight:700}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{background:#fff;color:#c0392b;border-color:#e3b3ad}
button.ghost{border:0;background:none;padding:8px 4px}header button{min-height:36px;padding:6px 10px}
main{max-width:1000px;margin:0 auto;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccd;z-index:20}
nav button{flex:1;border:0;border-radius:0;background:none;color:#667;font-size:13px;min-height:58px;padding:4px}
nav button.on{color:var(--pr);border-top:3px solid var(--pr)}nav i{display:block;font-style:normal;font-size:20px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.sp{flex:1}
label{display:block;font-size:13px;color:#556}
input,select,textarea{width:100%;min-height:42px;border:1px solid #b9c2cc;border-radius:6px;padding:8px;background:var(--in)}
input[readonly]{background:#eee}input[type=checkbox]{width:auto;min-height:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.w2{grid-column:1/-1}
.tabs{display:flex;gap:6px;margin:6px 0}.tabs button{flex:1;background:#dde5ee;border:0}.tabs button.on{background:var(--pr);color:#fff}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:17px}
.dc{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px #0002;display:flex;gap:10px;align-items:center;cursor:pointer}
.dc .m{flex:1;min-width:0}.dc .t{font-weight:700}.dc .s{font-size:13px;color:#667}.dc .a{text-align:right;font-weight:700}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;font-weight:700}
.chip.u{background:#fde8e5;color:#b3261e}.chip.ok{background:#e1f3e4;color:#1b6e2e}.chip.w{background:#fff1cc;color:#8a5a00}.chip.b{background:#e3ecfa;color:#1f4e79}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid #aab}.thumbs button{position:absolute;top:2px;right:2px;min-height:30px;padding:0 8px}
.viewer{position:fixed;inset:0;background:#000d;z-index:60;overflow:auto;padding:10px}.viewer img{max-width:100%;display:block;margin:auto}
.fab{position:fixed;right:16px;bottom:76px;z-index:25;border-radius:28px;padding:0 20px;min-height:52px;box-shadow:0 3px 8px #0004}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:5px 6px;text-align:center}th{background:#e7eef7}td.r{text-align:right}
.pr input{text-align:right}
.tw{overflow:auto;padding:6px}
.lg{min-width:1040px}.lg th,.lg td{padding:3px 4px;vertical-align:middle}
.lg input,.lg select{min-height:38px;padding:4px;width:100%}.lg input[type=number]{min-width:54px;text-align:center}.lg select{min-width:50px;padding:4px 0}
.lgl td:first-child{min-width:128px}.lg td.cn{min-width:84px;white-space:nowrap;text-align:left}.lg td.cm{min-width:120px}.lg input[type=date]{margin-top:3px;font-size:13px}
.lg .ac{white-space:nowrap}.lg .ac button{min-height:34px;padding:2px 8px;font-size:14px}.lg .ac .x{color:#b00;font-weight:400;font-size:13px}
.lg .sh{white-space:nowrap}.lg .sh select{width:50px;display:inline-block}.lg .sh input{width:64px;display:inline-block}
.lg tr.nr td{background:#fff3b8}.lg tr.hl td{background:#e3f0ff}.lg tr.clk{cursor:pointer}.lg tr.clk:hover td{background:#eef4fb}
.lg .rc{background:#f6f8fa;min-width:44px}.df{background:#ffd9d6!important;border-color:#c0392b!important}
.mk{font-size:11px;color:#a05a00;font-weight:700;margin-right:2px}
.dl th,.dl td{padding:3px 4px;font-size:12px}
.two{display:flex;gap:8px;min-width:700px;margin-bottom:6px}.two>table{flex:1;table-layout:fixed}
.stm .dl2 th,.stm .dl2 td{padding:1px 2px;font-size:11px;height:22px;overflow:hidden;white-space:nowrap}.stm .dl2 td.nm{text-align:left}
.pdfm .stm{padding:0;max-width:none;margin:0}.pdfm .stm .dl2 td,.pdfm .stm .dl2 th{height:6.1mm}.pdfm .two{min-width:0}.pdfm .stm .dl1 td,.pdfm .stm .dl1 th{height:6.1mm}
.stm .dl1{table-layout:fixed;margin-bottom:6px}.stm .dl1 th,.stm .dl1 td{padding:1px 3px;font-size:12px;height:22px;overflow:hidden;white-space:nowrap}.stm .dl1 td.nm{text-align:left}.stm .dl1 td.bg{text-align:left;font-size:11px;white-space:normal;line-height:1.15}.stm .dl1 thead{display:table-header-group}.stm .dl1 tr{break-inside:avoid}
.stm .notes{font-size:11px;color:#444;margin:2px 0 8px}.stm .keep{break-inside:avoid}
.sumt td,.sumt th{padding:4px}
.stm{background:#fff;padding:16px;max-width:760px;margin:auto}
.stm h2{text-align:center;letter-spacing:6px;margin:0 0 8px}
.stm .meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.stm .parties{display:flex;gap:8px;margin-bottom:8px}.stm .parties table{flex:1;font-size:12px}.stm .parties th{width:22%;white-space:nowrap}
.stm td,.stm th{padding:5px 6px}.stm .big{font-size:17px;font-weight:700}
.hide{display:none!important}
#print{display:none}
.modal{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:420px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;font-size:14px}
.muted{color:#667;font-size:13px}.warn{color:#b3261e}
@media print{body{padding:0;background:#fff}header,nav,main,.fab,.modal,.toast{display:none!important}#print{display:block}@page{size:A4;margin:10mm}.stm .dl2 td,.stm .dl2 th,.stm .dl1 td,.stm .dl1 th{height:6.1mm}.two{min-width:0}.stm{padding:0;max-width:none}}
#print table{font-size:13px}
</style></head><body>
<header><h1>거래명세서 <small style="font-size:11px;font-weight:400">v2026.11.07-b</small></h1><span id="st"></span><button id="syncbtn" title="동기화">⟳ 동기화</button></header>
<main id="main"></main>
<nav id="nav">
<button data-nav="ledger"><i>📥</i>접수대장</button><button data-nav="stmtlist"><i>📋</i>업체별 명세표</button><button data-nav="sales"><i>💰</i>매출·입금</button><button data-nav="settings"><i>⚙</i>설정</button></nav>
<div id="print"></div>
<script>
'use strict';
/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>(Math.round(+n||0)).toLocaleString('ko-KR');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const PRESET={id:'c_bupyeong',type:'customer',name:'부평',vat:'none',p:{top0:105000,top1:10000,vest0:50000,vest1:5000,bot0:50000,bot1:5000}};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(title,body,ok,okText='확인'){const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="box"><b>${esc(title)}</b>${body}<div class="row"><button class="p sp" data-ok>${okText}</button><button class="sp" data-no>취소</button></div></div>`;
 document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.dataset.no!==undefined)m.remove();else if(e.target.dataset.ok!==undefined){if(ok(m)!==false)m.remove()}};return m}
function download(name,text,type='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');

/* ================= 저장소 (IndexedDB) ================= */
let idb;const E=new Map();let dirty=new Set(),shas={};
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('invoice_v2',1);r.onupgradeneeded=()=>{r.result.createObjectStore('ent',{keyPath:'id'});r.result.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store=(s,m='readonly')=>idb.transaction(s,m).objectStore(s);
const dbPut=(s,v)=>req(store(s,'readwrite').put(v));
const saveMeta=async()=>{await dbPut('meta',{k:'dirty',v:[...dirty]});await dbPut('meta',{k:'shas',v:shas})};
async function put(e){e.updatedAt=Date.now();E.set(e.id,e);await dbPut('ent',e);dirty.add(e.id);await saveMeta();setSt();scheduleSync()}
const timers={};
function touch(e){setSt('저장 중…');clearTimeout(timers[e.id]);timers[e.id]=setTimeout(()=>{delete timers[e.id];put(e)},400)}
async function flush(){for(const id of Object.keys(timers)){clearTimeout(timers[id]);delete timers[id];await put(E.get(id))}}
const ents=t=>[...E.values()].filter(e=>e.type===t);
const customers=()=>ents('customer').filter(e=>!e.deleted).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
const getBiz=()=>(E.get('settings')||{}).biz||{};

/* ================= 업무 규칙 ================= */
// 접수(rcpt): 업체가 보낸 작업지시서 1건 = 접수대장 1줄. 출고 실적(s)은 접수 내용과 별개로 입력한다.
// 명세(stmt): 업체 x 월 단위. 접수 ym 이 같은 건들을 모아 마감/거래명세서/입금을 관리한다.
const IT=[['a','상의','top'],['b','조끼','vest'],['c','바지','bot']];
const MODES=['가','직'];
const rcpts=()=>ents('rcpt').filter(e=>!e.deleted);
const nextYm=y=>{let[Y,M]=y.split('-').map(Number);M++;if(M>12){M=1;Y++}return Y+'-'+String(M).padStart(2,'0')};
const prevYm=y=>{let[Y,M]=y.split('-').map(Number);M--;if(M<1){M=12;Y--}return Y+'-'+String(M).padStart(2,'0')};
const ymLabel=y=>y.slice(0,4)+'년 '+(+y.slice(5))+'월';
const stId=(cid,y)=>'s_'+cid+'_'+y;
const vatOf=s=>s.vat||(E.get(s.cid)||{}).vat||'none';
const qn=(o,k)=>+(o&&o[k])||0;
const shipped=r=>!!(r.s&&r.s.done);
function getSt(cid,y){const e=E.get(stId(cid,y));if(e&&!e.deleted)return e;return{id:stId(cid,y),type:'stmt',cid,ym:y,extra:[],pay:[],closed:false,closedAt:'',p:null,vat:'',sent:'',memo:''}}
function ensureSt(cid,y){let s=E.get(stId(cid,y));if(!s||s.deleted){s=getSt(cid,y);E.set(s.id,s)}return s}
const isClosed=(cid,y)=>!!getSt(cid,y).closed;
function openYm(cid,y){let n=0;while(isClosed(cid,y)&&n++<60)y=nextYm(y);return y}
const stRows=(cid,y)=>rcpts().filter(r=>r.cid===cid&&r.ym===y).sort((a,b)=>a.date.localeCompare(b.date)||(a.id<b.id?-1:1));
function stCalc(s){const rows=stRows(s.cid,s.ym),done=rows.filter(shipped),c=E.get(s.cid)||{},p=s.p||c.p||{};
 const t={};IT.forEach(([k])=>t[k]={q:0,g:0,j:0});
 done.forEach(r=>IT.forEach(([k])=>{const q=qn(r.s.q,k);t[k].q+=q;if(q){if(r.s.m[k]==='가')t[k].g+=q;else t[k].j+=q}}));
 const L=[];IT.forEach(([k,n,pf])=>L.push([n,t[k].q,+p[pf+'0']||0]));
 IT.forEach(([k,n,pf])=>L.push([n+' 가봉',t[k].g,+p[pf+'1']||0]));
 (s.extra||[]).forEach(x=>L.push([x.n||'기타',+x.q||0,+x.u||0]));
 const lines=L.filter(l=>l[1]!==0).map(([n,q,u])=>({n,q,u,a:q*u}));
 const supply=lines.reduce((a,l)=>a+l.a,0),vat=vatOf(s)==='excl'?Math.round(supply/10):0,total=supply+vat;
 const paid=(s.pay||[]).reduce((a,x)=>a+(+x.amt||0),0);
 return{rows,done,t,lines,supply,vat,total,paid,due:total-paid,miss:rows.length-done.length}}
const stMonths=cid=>{const m=new Set();rcpts().forEach(r=>r.cid===cid&&m.add(r.ym));ents('stmt').forEach(s=>!s.deleted&&s.cid===cid&&m.add(s.ym));return[...m].sort()};
const prevDue=(cid,y)=>stMonths(cid).filter(m=>m<y).reduce((a,m)=>a+stCalc(getSt(cid,m)).due,0);
const custDue=cid=>stMonths(cid).reduce((a,m)=>a+stCalc(getSt(cid,m)).due,0);
function allPairs(){const m=new Map();rcpts().forEach(r=>m.set(r.cid+'|'+r.ym,[r.cid,r.ym]));ents('stmt').filter(s=>!s.deleted).forEach(s=>m.set(s.cid+'|'+s.ym,[s.cid,s.ym]));return[...m.values()].filter(([cid])=>E.get(cid)&&!E.get(cid).deleted)}
function shipInit(r){r.s={done:true,date:today(),m:{...r.m},q:{a:qn(r.q,'a'),b:qn(r.q,'b'),c:qn(r.q,'c')}};return r}
function differs(r){if(!shipped(r))return false;return IT.some(([k])=>{const sq=qn(r.s.q,k),rq=qn(r.q,k);return sq!==rq||(sq&&r.s.m[k]!==r.m[k])})}
function diffNote(r){if(!shipped(r))return'';return IT.map(([k,n])=>{const sq=qn(r.s.q,k),rq=qn(r.q,k);if(sq!==rq)return`${n} 접수${rq}→출고${sq}`;if(sq&&r.s.m[k]!==r.m[k])return`${n} ${r.m[k]}→${r.s.m[k]}`;return''}).filter(Boolean).join(', ')}
const rcChip=r=>!shipped(r)?'<span class="chip w">미출고</span>':differs(r)?'<span class="chip u">수량차이</span>':'<span class="chip ok">출고</span>';
function stStatus(k,s){if(k.total>0&&k.due<=0)return['ok','입금완료'];if(k.paid>0)return['w','일부입금'];if(s.sent)return['b','발송(입금대기)'];if(s.closed)return['b','마감(미발송)'];return['w','진행중']}
const msel=(attr,v,dis)=>`<select ${attr}${dis?' disabled':''}>${MODES.map(m=>`<option${v===m?' selected':''}>${m}</option>`).join('')}</select>`;
const fc=(m,q)=>+q?`<span class="mk">${m==='가'?'가':''}</span>${q}`:'';

/* ================= 상태 / 라우팅 ================= */
const S={view:'ledger',cid:null,ym:today().slice(0,7),eid:null,hl:'',lm:today().slice(0,7),sm:today().slice(0,7),
 lf:{cid:'',month:today().slice(0,7),st:'',q:''},
 nr:{c:'',d:today(),fit:'',no:'',cu:'',ma:'가',qa:'',mb:'가',qb:'',mc:'가',qc:''}};
function go(v,o={},replace){Object.assign(S,{view:v},o);history[replace?'replaceState':'pushState']({view:S.view,cid:S.cid,ym:S.ym,eid:S.eid},'');render();window.scrollTo(0,0);
 if(S.hl){const t=document.querySelector('[data-rid="'+S.hl+'"]');if(t)t.scrollIntoView({block:'center'})}}
window.onpopstate=e=>{flush();const s=e.state;if(s)Object.assign(S,{view:s.view,cid:s.cid,ym:s.ym,eid:s.eid});else S.view='ledger';render()};
const VIEWS={};
function render(){const v=VIEWS[S.view]||VIEWS.ledger;$('#main').innerHTML=v();
 const nv={stmt:'stmtlist',invoice:'stmtlist',cust:'settings',custEdit:'settings'}[S.view]||S.view;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===nv))}

/* ================= 화면 1: 접수대장 (첫 화면) ================= */
function nrRow(){const n=S.nr,cs=customers();
 return `<tr class="nr"><td><input data-nr="c" list="cl" value="${esc(n.c)}" placeholder="업체 선택/신규 입력" autocomplete="off"><datalist id="cl">${cs.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><input type="date" data-nr="d" value="${esc(n.d)}" title="접수일"></td>
 <td><input data-nr="no" inputmode="numeric" maxlength="5" value="${esc(n.no)}" placeholder="5자리"></td>
 <td><input data-nr="cu" value="${esc(n.cu)}" placeholder="고객 성명"></td>
 ${IT.map(([k])=>`<td>${msel(`data-nr="m${k}"`,n['m'+k])}</td><td><input type="number" min="0" inputmode="numeric" data-nr="q${k}" value="${esc(n['q'+k])}"></td>`).join('')}
 <td><input type="date" data-nr="fit" value="${esc(n.fit)}" title="가봉일" style="margin-top:0;min-width:128px"></td>
 <td class="ac"><button class="p" data-act="nradd">+ 추가</button></td></tr>`}
function rcRow(r){const cs=customers(),id=r.id;
 return `<tr data-rid="${id}"><td><select data-r="${id}:c">${cs.map(c=>`<option value="${c.id}"${r.cid===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}${E.get(r.cid)&&!E.get(r.cid).deleted?'':`<option value="${r.cid}" selected>(삭제된 업체)</option>`}</select><input type="date" data-r="${id}:d" value="${esc(r.date)}"></td>
 <td><input data-r="${id}:no" inputmode="numeric" maxlength="5" value="${esc(r.no)}"></td>
 <td><input data-r="${id}:cu" value="${esc(r.cust)}"></td>
 ${IT.map(([k])=>`<td>${msel(`data-r="${id}:m${k}"`,r.m[k])}</td><td><input type="number" min="0" inputmode="numeric" data-r="${id}:q${k}" value="${r.q[k]||''}"></td>`).join('')}
 <td><input type="date" data-r="${id}:fit" value="${esc(r.fit||'')}" title="가봉일" style="margin-top:0;min-width:128px"></td>
 <td class="ac"><button data-act="rcstmt" data-id="${id}">명세서 보기</button><div class="chipc">${rcChip(r)}${r.org?' <span class="chip b">이월</span>':''}</div><button class="ghost x" data-act="rcdel" data-id="${id}">삭제</button></td></tr>`}
function lfList(){const f=S.lf,q=f.q.trim();
 return rcpts().filter(r=>(!f.cid||r.cid===f.cid)&&(!f.month||r.date.startsWith(f.month))&&(!f.st||(f.st==='o'?!shipped(r):shipped(r)))&&(!q||(r.cust||'').includes(q)||(r.no||'').includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||(a.id<b.id?1:-1))}
VIEWS.ledger=function(){const cs=customers(),ds=lfList(),f=S.lf,T={a:0,b:0,c:0};ds.forEach(r=>IT.forEach(([k])=>T[k]+=qn(r.q,k)));
 return `<div class="bar"><b>접수 대장</b><span class="muted">업체에서 받은 작업지시서를 입력합니다</span></div>
 <div class="card tw"><table class="lg lgl"><thead><tr><th>업체</th><th>관리번호<br>(5자리)</th><th>고객 성명</th><th>가/직</th><th>상의</th><th>가/직</th><th>조끼</th><th>가/직</th><th>바지</th><th>가봉일</th><th>명세서</th></tr></thead>

function pdfFrom(pages,W,H){

 add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
 off[1]=len;add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 off[2]=len;add(`2 0 obj\n<< /Type /Pages /Kids [${pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] /Count ${n} >>\nendobj\n`);
 pages.forEach((d,i)=>{const a=3+3*i,c=a+1,im=a+2,cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  off[a]=len;add(`${a} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${c} 0 R >>\nendobj\n`);
  off[c]=len;add(`${c} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
  off[im]=len;add(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${d.length} >>\nstream\n`);add(d);add('\nendstream\nendobj\n')});
 const N=3+3*n,xo=len;let x=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let i=1;i<N;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 add(x+`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);

 const SC=2.5,W=794,H=1123,MAXH=1040;
 const box=document.createElement('div');box.className='pdfm';box.style.cssText='position:fixed;left:-10000px;top:0;width:718px;font:16px/1.35 "Malgun Gothic","Noto Sans KR",sans-serif;color:#222;background:#fff';
 box.innerHTML=invHTML(cid,y);document.body.appendChild(box);
 const pages=[];
 try{
  const mh=el=>{const cs=getComputedStyle(el);return el.getBoundingClientRect().height+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0)};
  let cur=[],h=0;
  [...box.firstElementChild.children].forEach(u=>{
   if(u.classList.contains('dl1')){const rs=[...u.tBodies[0].rows],hh=u.tHead.getBoundingClientRect().height,rh=i=>rs[i].getBoundingClientRect().height;
    const mk=(a,b)=>{const c=u.cloneNode(true);[...c.tBodies[0].rows].forEach((r,i)=>{if(i<a||i>=b)r.remove()});return c};
    let a=0;
    while(a<rs.length){let b=a,s=hh;
     while(b<rs.length&&s+rh(b)<=MAXH-h){s+=rh(b);b++}
     if(b===a){if(cur.length){pages.push(cur);cur=[];h=0;continue}b=a+1;s=hh+rh(a)}
     cur.push(mk(a,b));h+=s;a=b;
     if(a<rs.length){pages.push(cur);cur=[];h=0}}
    return}
   const uh=mh(u),brk=u.style.pageBreakBefore==='always';
   if(cur.length&&(brk||h+uh>MAXH)){pages.push(cur);cur=[];h=0}cur.push(u.cloneNode(true));h+=uh});
  pages.push(cur)}finally{box.remove()}
 const css=[...document.styleSheets].map(s=>{try{return[...s.cssRules].filter(r=>r.type===1).map(r=>r.cssText).join('\n')}catch(e){return''}}).join('\n');
 const jpgs=[];
 for(let i=0;i<pages.length;i++){
  const wrap=document.createElement('div');wrap.className='pdfm';
  wrap.setAttribute('style',`position:relative;width:${W}px;height:${H}px;padding:38px;box-sizing:border-box;overflow:hidden;font:16px/1.35 "Malgun Gothic","Noto Sans KR",sans-serif;color:#222;background:#fff`);
  const st=document.createElement('style');st.textContent=css;wrap.appendChild(st);
  const d=document.createElement('div');d.className='stm';pages[i].forEach(u=>d.appendChild(u));wrap.appendChild(d);
  if(pages.length>1){const f=document.createElement('div');f.setAttribute('style','position:absolute;right:38px;bottom:14px;font-size:11px;color:#666');f.textContent=(i+1)+' / '+pages.length;wrap.appendChild(f)}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">${new XMLSerializer().serializeToString(wrap)}</foreignObject></svg>`;
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('명세서 이미지를 만들지 못했습니다'))});
  const cv=document.createElement('canvas');cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));if(!bl)throw new Error('이미지 변환 실패');
  jpgs.push(new Uint8Array(await bl.arrayBuffer()))}
 return pdfFrom(jpgs,Math.round(W*SC),Math.round(H*SC))}

let syncing=false,syncTimer=null;
const lastSync=()=>+localStorage.getItem('last_sync')||0;
function setSt(msg){const c=cfg();const m=msg||(Object.keys(timers).length?'저장 중…':!c?'이 기기에만 저장됨':!navigator.onLine?`오프라인 · 대기 ${dirty.size}건`:dirty.size?`동기화 대기 ${dirty.size}건`:'✓ 동기화됨 '+new Date(lastSync()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
 $('#st').textContent=m;const s=$('#synstat');if(s)s.textContent=' · '+m}
function scheduleSync(){if(!cfg())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),3000)}
async function gh(path,raw){const c=cfg();const r=await fetch(`https://api.github.com/repos/${c.repo}${path}`,{cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
 if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}return raw?r.text():r.json()}
const b64=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(o)};
async function ghPut(id,e){const c=cfg();const body={message:'update '+id,content:b64(JSON.stringify(e)),branch:'main'};if(shas[id])body.sha=shas[id];
 const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/data/${id}.json`,{method:'PUT',cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){const er=new Error('GitHub '+r.status);er.status=r.status;throw er}return (await r.json()).content.sha}
async function sync(manual){const c=cfg();if(!c||syncing)return;if(!navigator.onLine){setSt();if(manual)toast('오프라인입니다');return}
 syncing=true;setSt('동기화 중…');let changed=false;
 try{await flush();
  for(let attempt=0;attempt<3;attempt++){
   const tree=await gh('/git/trees/main?recursive=1'),remote={};
   for(const t of tree.tree){const m=/^data\/(.+)\.json$/.exec(t.path);if(m&&t.type==='blob')remote[m[1]]=t.sha}
   for(const id of Object.keys(remote)){if(shas[id]===remote[id])continue;
    const e=JSON.parse(await gh('/git/blobs/'+remote[id],true)),l=E.get(id);
    if(!l||e.updatedAt>l.updatedAt){E.set(id,e);await dbPut('ent',e);dirty.delete(id);changed=true}else if(e.updatedAt<l.updatedAt)dirty.add(id);
    shas[id]=remote[id]}
   for(const id of Object.keys(remote))if(!shas[id])shas[id]=remote[id];
   let conflict=false;
   for(const id of [...dirty]){const e=E.get(id);if(!e){dirty.delete(id);continue}
    try{shas[id]=await ghPut(id,e);dirty.delete(id)}catch(er){if(er.status===409||er.status===422){conflict=true;delete shas[id];break}throw er}}
   await saveMeta();if(!conflict)break}
  localStorage.setItem('last_sync',Date.now());setSt();if(manual)toast('동기화 완료');
  if(changed){if(!document.activeElement||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()}
 }catch(er){const m=er.status===401||er.status===403?'토큰 오류 — 설정에서 확인':er.status===404?'저장소를 찾을 수 없음 — 설정 확인':'동기화 실패(나중에 다시 시도)';setSt(m);if(manual)toast(m)}
 finally{syncing=false}}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();else sync(false)});
addEventListener('pagehide',()=>flush());
